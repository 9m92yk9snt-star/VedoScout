name: FIX10A goal sequence stabilization one-shot

on:
  push:
    branches: [fix10-match-intelligence]
    paths:
      - '.github/workflows/fix10a-goalstab-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix10-match-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused FIX10A dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 pytest-asyncio==1.4.0 numpy==2.4.6 opencv-python-headless==4.13.0.92 python-dotenv==1.2.2
      - name: Provide CI-only no-network Emergent import stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci_stubs/emergentintegrations/llm
          touch /tmp/ci_stubs/emergentintegrations/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/llm/__init__.py
          cat > /tmp/ci_stubs/emergentintegrations/llm/chat.py <<'PY'
          class _Payload:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              def model_dump(self):
                  return dict(self.__dict__)
          class UserMessage(_Payload):
              pass
          class ImageContent(_Payload):
              pass
          class FileContentWithMimeType(_Payload):
              pass
          class LlmChat:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              def with_model(self, provider, model):
                  self.provider = provider
                  self.model = model
                  return self
              async def send_message(self, _message):
                  raise RuntimeError('CI Emergent stub: network/model call forbidden')
          PY
      - name: Decode and apply stabilization patch
        shell: bash
        run: |
          set -euo pipefail
          cat docs/fix10a_goalstab_src00.tmp docs/fix10a_goalstab_src01.tmp | base64 -d | bunzip2 > /tmp/goalstab.patch
          printf '%s  %s\n' '04c8dd46b63707f361ecdec8775589a88410ee89424d0afd71639b65589f9a27' /tmp/goalstab.patch | sha256sum -c -
          git apply --check /tmp/goalstab.patch
          git apply /tmp/goalstab.patch
      - name: Compile and run FIX10A family
        working-directory: backend
        env:
          PYTHONPATH: /tmp/ci_stubs:.
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ball_contact_engine.py dense_track_refinement.py short_occlusion_contact_recovery.py golden_fixture_validator.py tests/test_fix10a_goal_sequence_stabilization.py
          pytest --asyncio-mode=auto -q tests/test_fix10a*.py
      - name: Commit verified stabilization and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/fix10a_goalstab_src00.tmp docs/fix10a_goalstab_src01.tmp .github/workflows/fix10a-goalstab-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/ball_contact_engine.py backend/dense_track_refinement.py backend/short_occlusion_contact_recovery.py backend/golden_fixture_validator.py backend/tests/test_fix10a_goal_sequence_stabilization.py docs/fix10a_goalstab_src00.tmp docs/fix10a_goalstab_src01.tmp .github/workflows/fix10a-goalstab-one-shot.yml
          git diff --cached --check
          git commit -m 'FIX10A: stabilize target handoff and dribble continuity'
          git push origin HEAD:fix10-match-intelligence
