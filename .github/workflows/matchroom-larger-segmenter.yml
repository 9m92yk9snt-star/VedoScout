name: Match Room larger segmenter export
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/matchroom-larger-segmenter.yml']
permissions:
  contents: read
jobs:
  export:
    if: >-
      github.repository == '9m92yk9snt-star/VedoScout' &&
      github.event.pull_request.number == 55 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/matchroom-graphics' &&
      github.event.before == '1283685597a9ecfc7e7417650321ccbb0b0f93f3' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated export tools
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ultralytics==8.3.0 onnx==1.17.0 'numpy<2'
      - name: Export public model weights only; no user footage or provider calls
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/yolo-config
        run: |
          python - <<'PY'
          from ultralytics import YOLO
          import hashlib,json,pathlib
          target=YOLO('yolov8m-seg.pt').export(format='onnx',opset=17,simplify=False,imgsz=640,dynamic=False)
          p=pathlib.Path(target)
          pathlib.Path('model-manifest.json').write_text(json.dumps({'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'ultralytics':'8.3.0','purpose':'Isolated duel diagnosis; not a production model replacement'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: matchroom-larger-segmenter
          path: |
            yolov8m-seg.onnx
            model-manifest.json
          retention-days: 3
          compression-level: 1
