name: Source-bound Orman1000 shadow review projection and proof parity
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/orman1000-shadow-review-once.yml'
permissions:
  contents: read
jobs:
  run_shadow_only:
    if: >-
      github.repository == '9m92yk9snt-star/VedoScout' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/matchroom-window-geometry-reuse' &&
      github.event.before == '60b34420fc0fbea9b71fcf021581f7f3534f9c30' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only offline pytest dependencies
        run: |
          python -m pip install 'pytest==9.0.3' 'python-dotenv==1.2.2' 'numpy==2.4.6' 'opencv-python-headless==4.13.0.92'
      - name: Assert no-model deterministic report projection and source-gate contracts
        run: |
          python -m py_compile backend/orman1000_derived_consistency.py backend/orman1000_role_spatial_gate.py backend/orman1000_review_provenance.py backend/scripts/stage_orman1000_duel_tail.py backend/scripts/build_orman1000_review_shadow.py backend/scripts/finalize_orman1000_review_candidate.py backend/scripts/rebuild_orman1000_review_publication.py
          python -m pytest -q backend/tests/test_orman1000_release_gate.py backend/tests/test_orman1000_duel_completion_staging.py backend/tests/test_orman1000_publication_preview.py backend/tests/test_orman1000_review_shadow.py backend/tests/test_orman1000_role_spatial_gate.py backend/tests/test_orman1000_source_frame_hashes.py backend/tests/test_orman1000_adjudication_preview.py backend/tests/test_orman1000_release_source.py
