name: ChatGPT stage FIX10B server integration

on:
  push:
    branches: [chatgpt-production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-server:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-production-hardening
          fetch-depth: 0
      - name: Apply exact FIX10B integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text()

          replacements = [
              (
                  'import fix10a_shadow_runtime\n',
                  'import fix10a_shadow_runtime\nimport fix10b_runtime\n',
                  'FIX10B import',
              ),
              (
                  '        _unified_prepared = None\n        _unified_result = None\n',
                  '        _unified_prepared = None\n        _unified_result = None\n        _fix10a_task = None\n',
                  'FIX10A task slot',
              ),
              (
                  '                        fix10a_shadow_runtime.spawn_shadow(\n',
                  '                        _fix10a_task = fix10a_shadow_runtime.spawn_shadow(\n',
                  'capture FIX10A task',
              ),
          ]
          for old, new, label in replacements:
              if new in s:
                  continue
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 old occurrence, found {count}')
              s = s.replace(old, new, 1)

          old = '''        if isinstance(_unified_result, dict):
            full = unified_analysis_engine.apply_result_to_report(full, _unified_result)
        else:
'''
          new = '''        if isinstance(_unified_result, dict):
            # FIX10B — the full-report model and FIX10A physical reconstruction
            # run concurrently. Only when the explicit canonical flag is ON do
            # we wait here, immediately before canonical report projection, and
            # apply the separate proof-gated reconciliation candidate. FIX10A
            # itself remains canonical_authority=False.
            if _fix10a_task is not None and fix10b_runtime.canonical_enabled():
                try:
                    _shadow_result = await _fix10a_task
                    _fix10b_candidate = (
                        (_shadow_result or {}).get("_fix10b_candidate")
                        if isinstance(_shadow_result, dict) else None
                    )
                    if (
                        isinstance(_fix10b_candidate, dict)
                        and _fix10b_candidate.get("enabled") is True
                        and isinstance(_fix10b_candidate.get("unified_result"), dict)
                    ):
                        _unified_result = _fix10b_candidate["unified_result"]
                        event_ledger_obj = _unified_result.get("event_ledger")
                        _fix10b_summary = dict(_fix10b_candidate.get("summary") or {})
                        _payload = unified_analysis_engine.persistence_payload(_unified_result)
                        _payload.update({
                            "fix10b_status": _fix10b_summary.get("status") or "no_change",
                            "fix10b_version": 1,
                            "fix10b_summary": _fix10b_summary,
                            "fix10b_canonical_authority": True,
                        })
                        await db.reports.update_one({"id": report_id}, {"$set": _payload})
                        logger.info(
                            "[fix10b] %s: canonical reconciliation status=%s applied=%d",
                            report_id,
                            _fix10b_summary.get("status"),
                            int(_fix10b_summary.get("proposals_applied") or 0),
                        )
                except Exception:
                    # A reconciliation failure must never fabricate truth. The
                    # already-verified FIX09B result remains the fail-closed
                    # canonical fallback and report generation continues.
                    logger.exception("[fix10b] canonical reconciliation failed for %s", report_id)
            full = unified_analysis_engine.apply_result_to_report(full, _unified_result)
        else:
'''
          if new not in s:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'FIX10B report projection: expected exactly 1 old occurrence, found {count}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          python -m py_compile backend/server.py
          git diff --check
          git diff -- backend/server.py
      - name: Commit exact server patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/server.py; then
            echo 'Server already patched; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git commit -m 'FIX10B: integrate proof-gated canonical reconciliation before report projection'
          git push origin HEAD:chatgpt-production-hardening
