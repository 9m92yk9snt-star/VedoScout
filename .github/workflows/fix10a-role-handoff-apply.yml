name: FIX10A role handoff apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate exact FIX10A Step-3 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "91d15e6cf9e8f9d2ac4638b827385f79f2c07ca5"
          test "$(git rev-parse HEAD~2)" = "829d1b26cef735f6f5477f562c5a8d9bac265538"
          test "$(git rev-parse HEAD~3)" = "d63ece3f13e12dbf34ce3c4d09f32121c66077e4"
          test "$(git hash-object backend/fix10a_vision_providers.py)" = "c8e168150f83bf09d938608e9fdb7d8dfea62cb2"
          test "$(git hash-object backend/physical_match_reconstruction.py)" = "b7a937e32717013a38df435ab22a17a306d1ee20"
          echo '2f80f84e17e81db46925952b2fed1fb2be3d9b9762bca9616b1c06b2a6b4a445  .fix10a_support_role_handoff.patch' | sha256sum -c -
          git apply --check .fix10a_support_role_handoff.patch
      - name: Apply role-handoff patch
        run: git apply .fix10a_support_role_handoff.patch
      - name: Install project requirements available outside Emergent runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Provide CI-only no-network Emergent stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci_stubs/emergentintegrations/llm
          mkdir -p /tmp/ci_stubs/emergentintegrations/payments/stripe
          touch /tmp/ci_stubs/emergentintegrations/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/llm/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/payments/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/payments/stripe/__init__.py
          cat > /tmp/ci_stubs/emergentintegrations/llm/chat.py <<'PY'
          class _Payload:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              def model_dump(self):
                  return dict(self.__dict__)
          class UserMessage(_Payload): pass
          class ImageContent(_Payload): pass
          class FileContentWithMimeType(_Payload): pass
          class LlmChat:
              def __init__(self, **kwargs): self.__dict__.update(kwargs)
              def with_model(self, provider, model):
                  self.provider = provider; self.model = model; return self
              async def send_message(self, _message):
                  raise RuntimeError('CI Emergent stub: network/model call forbidden')
          PY
          cat > /tmp/ci_stubs/emergentintegrations/payments/stripe/checkout.py <<'PY'
          class _Payload:
              def __init__(self, **kwargs): self.__dict__.update(kwargs)
              def model_dump(self): return dict(self.__dict__)
          class CheckoutSessionResponse(_Payload): pass
          class CheckoutStatusResponse(_Payload): pass
          class CheckoutSessionRequest(_Payload): pass
          class StripeCheckout:
              def __init__(self, **kwargs): self.__dict__.update(kwargs)
              async def create_checkout_session(self, *_args, **_kwargs):
                  raise RuntimeError('CI Emergent stub: payment call forbidden')
              async def get_checkout_status(self, *_args, **_kwargs):
                  raise RuntimeError('CI Emergent stub: payment call forbidden')
          PY
      - name: Reproduce Emergent app layout
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /app
          sudo ln -sfn "$GITHUB_WORKSPACE/backend" /app/backend
          sudo ln -sfn "$GITHUB_WORKSPACE/frontend" /app/frontend
          mkdir -p backend/uploads
          if [ ! -f frontend/.env ]; then
            printf '%s\n' 'REACT_APP_BACKEND_URL=http://127.0.0.1:8000' > frontend/.env
          fi
      - name: Compile supporting-vision handoff modules
        env:
          PYTHONPATH: /tmp/ci_stubs:backend
        run: |
          python -m py_compile \
            backend/fix10a_vision_providers.py \
            backend/physical_match_reconstruction.py \
            backend/post_strike_intervention.py \
            backend/shot_outcome_engine.py
      - name: Run full FIX10A regression family
        working-directory: backend
        env:
          PYTHONPATH: /tmp/ci_stubs:.
        run: pytest --asyncio-mode=auto -q tests/test_fix10a*.py
      - name: Run historical FIX00-FIX09 and unified regression contract
        working-directory: backend
        env:
          PYTHONPATH: /tmp/ci_stubs:.
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: vedoscout_fix10_role_handoff_ci
          EMERGENT_LLM_KEY: ci-placeholder
          STRIPE_API_KEY: sk_test_placeholder
          JWT_SECRET_KEY: fix10-ci-secret
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
          FIX10A_SHADOW_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FIX_FILES < <(find tests -maxdepth 1 -type f -name 'test_fix*.py' ! -name 'test_fix10a*.py' | sort)
          test "${#FIX_FILES[@]}" -gt 0
          pytest --asyncio-mode=auto -q "${FIX_FILES[@]}" tests/test_unified_analysis_engine.py
      - name: Package exact applied runtime
        uses: actions/upload-artifact@v4
        with:
          name: fix10a-role-handoff-runtime
          path: |
            backend/*.py
            backend/models/yolov8n.onnx
            backend/requirements.txt
            backend/tests/fixtures/real_video/almin_test07_v1.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Commit verified supporting-vision handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '9m92yk9snt-star'
          git config user.email '9m92yk9snt@privaterelay.appleid.com'
          git rm .fix10a_support_role_handoff.patch .github/workflows/fix10a-role-handoff-apply.yml
          git add backend/fix10a_vision_providers.py backend/physical_match_reconstruction.py backend/tests/test_fix10a7_role_intervention_handoff.py
          git commit -m 'FIX10A support vision: hand A7 intervention actor to role verification'
          git push origin HEAD:fix10-match-intelligence
