name: Retained Match Room exact-PTS playback audit (once)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/matchroom-playback-pts-audit-once.yml'

permissions:
  contents: read
  actions: read

jobs:
  exact_pts_playback_audit:
    if: >-
      github.repository == '9m92yk9snt-star/VedoScout' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/matchroom-window-geometry-reuse' &&
      github.event.before == '0f0a76984937d21545df805891beb5c55d9899cb' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Supply pinned source decoder without apt/ffprobe
        run: |
          python -m pip install --disable-pip-version-check 'imageio-ffmpeg==0.6.0'
          FFMPEG_SOURCE="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$FFMPEG_SOURCE"
          echo "SCOUTMEPLAY_FFMPEG_BIN=$FFMPEG_SOURCE" >> "$GITHUB_ENV"
          "$FFMPEG_SOURCE" -hide_banner -version
          node --check frontend/scripts/audit-retained-matchroom-playback.cjs
      - name: Retrieve same-source prior report and clips (zero provider calls)
        uses: actions/download-artifact@v4
        with:
          name: matchroom-single-tap-report-41772727152
          run-id: 41772727152
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained
      - name: Audit actual source-aligned video PTS using production playback model
        run: |
          node frontend/scripts/audit-retained-matchroom-playback.cjs \
            "$RUNNER_TEMP/retained/single-tap-report/report-document.json" \
            "$RUNNER_TEMP/matchroom-pts-coverage.json"
      - name: Preserve only coverage counts, no video or receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchroom-pts-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/matchroom-pts-coverage.json
          retention-days: 14
          if-no-files-found: ignore
