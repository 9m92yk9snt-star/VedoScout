name: FIX09C canonical proof scratch

on:
  push:
    branches:
      - fix-09c-proof-scratch
    paths-ignore:
      - .fix09c-proof-result.txt

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test deps
        run: python -m pip install --disable-pip-version-check pytest python-dotenv
      - name: Apply canonical telestration patch
        id: patch
        shell: bash
        run: |
          set +e
          python backend/scripts/apply_fix09c_event_telestration.py > /tmp/patch.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compile server
        id: compile
        shell: bash
        run: |
          set +e
          python -m py_compile backend/server.py > /tmp/compile.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run deterministic B/C suite
        id: tests
        shell: bash
        run: |
          set +e
          cd backend
          python -m pytest -q \
            tests/test_fix09b0_unified_identity_authority.py \
            tests/test_fix09b0_event_bridge.py \
            tests/test_fix09b1_scene_graph.py \
            tests/test_fix09b2_sequence_intelligence.py \
            tests/test_fix09b3_canonical_event_resolver.py \
            tests/test_fix09c_canonical_output_authority.py \
            tests/test_fix09c_stats_precision.py \
            tests/test_unified_analysis_engine.py \
            > /tmp/tests.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist result and patched server
        shell: bash
        run: |
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'patch_exit=%s\n' "${{ steps.patch.outputs.rc }}"
            printf 'compile_exit=%s\n' "${{ steps.compile.outputs.rc }}"
            printf 'tests_exit=%s\n' "${{ steps.tests.outputs.rc }}"
            printf '%s\n' '--- patch ---'; cat /tmp/patch.txt
            printf '%s\n' '--- compile ---'; cat /tmp/compile.txt
            printf '%s\n' '--- tests ---'; cat /tmp/tests.txt
          } > .fix09c-proof-result.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add backend/server.py .fix09c-proof-result.txt
          git commit -m 'Scratch: apply and verify canonical event telestration' || true
          git push
