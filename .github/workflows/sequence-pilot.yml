name: Standalone sequence experiment

on:
  pull_request:
    paths:
      - 'backend/sequence_pilot*.py'
      - 'backend/scripts/run_sequence_pilot.py'
      - 'backend/scripts/probe_sequence_detail.py'
      - 'backend/scripts/probe_native_play.py'
      - 'backend/scripts/run_native_batch.py'
      - 'backend/scripts/probe_native_gaps.py'
      - 'backend/scripts/refine_contact_cluster.py'
      - 'backend/tests/test_native_cluster.py'
      - 'backend/tests/test_sequence_pilot.py'
      - 'backend/scripts/probe_actor_continuity.py'
      - 'backend/scripts/probe_continuous_pass.py'
      - 'backend/scripts/probe_unanchored_play.py'
      - 'backend/tests/test_unanchored_play.py'
      - 'backend/tests/test_continuous_pass.py'
      - 'backend/tests/test_actor_identity.py'
      - 'backend/tests/test_pass_finish_detail.py'
      - 'backend/player_selection.py'
      - '.github/workflows/sequence-pilot.yml'

permissions:
  contents: read

concurrency:
  group: sequence-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline_sequence_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version
      - name: Install isolated offline-test dependencies
        run: python -m pip install 'numpy<3' 'opencv-python-headless<5' 'Pillow>=10,<15' 'pytest>=8,<10' 'python-dotenv>=1,<2'
      - name: Verify input sampling, attribution, causal outcomes and worker deadlines
        run: python -m pytest backend/tests/test_sequence_pilot.py backend/tests/test_native_cluster.py backend/tests/test_actor_identity.py backend/tests/test_pass_finish_detail.py backend/tests/test_continuous_pass.py backend/tests/test_unanchored_play.py backend/tests/test_player_selection.py backend/tests/test_fix39_selection_box_edge.py -q

