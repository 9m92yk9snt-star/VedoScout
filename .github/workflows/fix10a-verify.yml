name: FIX10A verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix10a3-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix10-match-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check whether exact A3 baseline is still present
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          APPLY=false
          if [ "$(git hash-object backend/ball_trajectory.py)" = "761424feaac1625dc2792eeeec7624c342f370e2" ] \
             && [ "$(git hash-object backend/dense_track_refinement.py)" = "8c3a5517fe6c1330dff9e506138074af067fe971" ] \
             && [ -f .github/patches/fix10a3-dormant.patch ] \
             && echo "8ecdd035294d55ce0f3ea03f289d42c5d5fd5f308a87ac99aea41b8f005d5388  .github/patches/fix10a3-dormant.patch" | sha256sum -c - >/dev/null \
             && git apply --check .github/patches/fix10a3-dormant.patch; then
            APPLY=true
          fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
      - name: Apply validated A3 patch
        if: steps.gate.outputs.apply == 'true'
        run: git apply .github/patches/fix10a3-dormant.patch
      - name: Run focused A3 checks
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==9.0.3 numpy==2.4.6 opencv-python-headless==4.13.0.92 python-dotenv==1.2.2
          PYTHONPATH=backend pytest -q \
            backend/tests/test_fix10a3_ball_trajectory.py \
            backend/tests/test_fix10a3_dormant_reacquisition.py \
            backend/tests/test_fix10a2_dense_ball_floor.py
      - name: Commit runtime and tests only
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            backend/ball_trajectory.py \
            backend/dense_track_refinement.py \
            backend/tests/test_fix10a3_dormant_reacquisition.py \
            backend/tests/test_fix10a2_dense_ball_floor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX10A3: add dormant ball reacquisition'
          git push origin HEAD:fix10-match-intelligence
