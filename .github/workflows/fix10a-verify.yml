name: FIX10 production verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# TEMPORARY: write is needed only by the one-shot server integration job below.
# It is returned to contents: read immediately after backend/server.py is patched.
permissions:
  contents: write

jobs:
  fix10-production-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FIX10A/FIX10B test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 pytest-asyncio==1.4.0 numpy==2.4.6 opencv-python-headless==4.13.0.92 python-dotenv==1.2.2
      - name: Provide CI-only no-network Emergent import stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci_stubs/emergentintegrations/llm
          touch /tmp/ci_stubs/emergentintegrations/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/llm/__init__.py
          cat > /tmp/ci_stubs/emergentintegrations/llm/chat.py <<'PY'
          class _Payload:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
          class UserMessage(_Payload):
              pass
          class ImageContent(_Payload):
              pass
          class FileContentWithMimeType(_Payload):
              pass
          class LlmChat:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              def with_model(self, provider, model):
                  self.provider = provider
                  self.model = model
                  return self
              async def send_message(self, _message):
                  raise RuntimeError("CI Emergent stub: network/model call forbidden")
          PY
      - name: Compile production backend modules
        env:
          PYTHONPATH: /tmp/ci_stubs:backend
        run: |
          python -m py_compile \
            backend/motion_compensation.py \
            backend/dense_replay.py \
            backend/dense_track_refinement.py \
            backend/ball_trajectory.py \
            backend/ball_contact_engine.py \
            backend/touch_graph.py \
            backend/jersey_consensus.py \
            backend/shot_outcome_engine.py \
            backend/event_trace.py \
            backend/physical_match_reconstruction.py \
            backend/open_observation_compat.py \
            backend/fix10a_vision_providers.py \
            backend/fix10a_goal_direction.py \
            backend/fix10a_runtime.py \
            backend/fix10b_reconciliation.py \
            backend/fix10b_runtime.py \
            backend/golden_fixture_validator.py \
            backend/run_real_video_golden.py \
            backend/football_sequence_intelligence.py \
            backend/identity_verify.py \
            backend/server.py
      - name: Run FIX10A + FIX10B regression families
        working-directory: backend
        env:
          PYTHONPATH: /tmp/ci_stubs:.
        run: pytest --asyncio-mode=auto -q tests/test_fix10a*.py tests/test_fix10b*.py
      - name: Package exact FIX10 production runtime for private Golden diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fix10-production-runtime
          path: |
            backend/*.py
            backend/models/yolov8n.onnx
            backend/requirements.txt
            backend/tests/fixtures/real_video/almin_test07_v1.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  existing-backend-regression-attempt:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project requirements available outside Emergent runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Provide CI-only no-network Emergent import stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci_stubs/emergentintegrations/llm
          mkdir -p /tmp/ci_stubs/emergentintegrations/payments/stripe
          touch /tmp/ci_stubs/emergentintegrations/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/llm/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/payments/__init__.py
          touch /tmp/ci_stubs/emergentintegrations/payments/stripe/__init__.py
          cat > /tmp/ci_stubs/emergentintegrations/llm/chat.py <<'PY'
          class _Payload:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              def model_dump(self):
                  return dict(self.__dict__)
          class UserMessage(_Payload):
              pass
          class ImageContent(_Payload):
              pass
          class FileContentWithMimeType(_Payload):
              pass
          class LlmChat:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              def with_model(self, provider, model):
                  self.provider = provider
                  self.model = model
                  return self
              async def send_message(self, _message):
                  raise RuntimeError("CI Emergent stub: network/model call forbidden")
          PY
          cat > /tmp/ci_stubs/emergentintegrations/payments/stripe/checkout.py <<'PY'
          class _Payload:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              def model_dump(self):
                  return dict(self.__dict__)
          class CheckoutSessionResponse(_Payload):
              pass
          class CheckoutStatusResponse(_Payload):
              pass
          class CheckoutSessionRequest(_Payload):
              pass
          class StripeCheckout:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
              async def create_checkout_session(self, *_args, **_kwargs):
                  raise RuntimeError("CI Emergent stub: payment call forbidden")
              async def get_checkout_status(self, *_args, **_kwargs):
                  raise RuntimeError("CI Emergent stub: payment call forbidden")
          PY
      - name: Reproduce Emergent /app layout for chronological tests
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /app
          sudo ln -sfn "$GITHUB_WORKSPACE/backend" /app/backend
          sudo ln -sfn "$GITHUB_WORKSPACE/frontend" /app/frontend
          mkdir -p backend/uploads
          if [ ! -f frontend/.env ]; then
            printf '%s\n' 'REACT_APP_BACKEND_URL=http://127.0.0.1:8000' > frontend/.env
          fi
      - name: Run historical chronological regression contract
        working-directory: backend
        env:
          PYTHONPATH: /tmp/ci_stubs:.
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: vedoscout_fix10_ci
          EMERGENT_LLM_KEY: ci-placeholder
          STRIPE_API_KEY: sk_test_placeholder
          JWT_SECRET_KEY: fix10-ci-secret
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FIX_FILES < <(find tests -maxdepth 1 -type f -name 'test_fix*.py' ! -name 'test_fix10a*.py' ! -name 'test_fix10b*.py' | sort)
          test "${#FIX_FILES[@]}" -gt 0
          pytest --asyncio-mode=auto -q "${FIX_FILES[@]}" tests/test_unified_analysis_engine.py

  # One-shot branch-local integration because backend/server.py is too large
  # for a safe whole-file contents API replacement. Exact guarded replacements
  # are applied and only backend/server.py is committed by this job.
  stage-production-server:
    if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt-production-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-production-hardening
          fetch-depth: 0
      - name: Replace FIX10A shadow path with synchronous production FIX10A/FIX10B
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text()

          old_import = 'import fix10a_shadow_runtime\n'
          new_import = 'import fix10a_runtime\nimport fix10b_runtime\n'
          if new_import not in s:
              count = s.count(old_import)
              if count != 1:
                  raise SystemExit(f'production import: expected exactly 1 old occurrence, found {count}')
              s = s.replace(old_import, new_import, 1)

          old = '''                    # FIX10A — observe-only physical reconstruction. Feature flag
                    # defaults OFF. The task writes only fix10a_* diagnostics and
                    # can never mutate canonical B3/FIX09C truth.
                    if fix10a_shadow_runtime.shadow_enabled():
                        fix10a_shadow_runtime.spawn_shadow(
                            report_id=report_id,
                            video_path=str(file_path),
                            unified_result=_unified_result,
                            db=db,
                            r2_storage=r2_storage,
                            source_video={
                                "role": "CANONICAL_WEB_VIDEO",
                                "fingerprint": doc.get("fingerprint") or {},
                            },
                            local_dir=UPLOAD_DIR / ".fix10a_traces",
                        )
'''
          new = '''                    # FIX10A + FIX10B production path. Physical reconstruction
                    # is awaited here; there is no shadow/background task. FIX10A
                    # contributes physical evidence and FIX10B is the proof-gated
                    # canonical reconciliation authority.
                    try:
                        _fix10a_result = await fix10a_runtime.run(
                            report_id=report_id,
                            video_path=str(file_path),
                            unified_result=_unified_result,
                            db=db,
                            r2_storage=r2_storage,
                            source_video={
                                "role": "CANONICAL_WEB_VIDEO",
                                "fingerprint": doc.get("fingerprint") or {},
                            },
                            local_dir=UPLOAD_DIR / ".fix10a_traces",
                        )
                        _fix10b_candidate = (
                            (_fix10a_result or {}).get("_fix10b_candidate")
                            if isinstance(_fix10a_result, dict) else None
                        )
                        if (
                            isinstance(_fix10b_candidate, dict)
                            and _fix10b_candidate.get("enabled") is True
                            and isinstance(_fix10b_candidate.get("unified_result"), dict)
                        ):
                            _unified_result = _fix10b_candidate["unified_result"]
                            event_ledger_obj = _unified_result.get("event_ledger")
                            _fix10b_summary = dict(_fix10b_candidate.get("summary") or {})
                            _payload = unified_analysis_engine.persistence_payload(_unified_result)
                            _payload.update({
                                "fix10b_status": _fix10b_summary.get("status") or "no_change",
                                "fix10b_version": int(_fix10b_candidate.get("version") or 2),
                                "fix10b_mode": "production",
                                "fix10b_summary": _fix10b_summary,
                                "fix10b_canonical_authority": True,
                            })
                            await db.reports.update_one({"id": report_id}, {"$set": _payload})
                            logger.info(
                                "[fix10b] %s: production reconciliation status=%s applied=%d",
                                report_id,
                                _fix10b_summary.get("status"),
                                int(_fix10b_summary.get("proposals_applied") or 0),
                            )
                    except Exception:
                        # Fail closed: retain the already verified FIX09B result.
                        logger.exception(
                            "[fix10] production physical reconciliation failed for %s; retaining FIX09B truth",
                            report_id,
                        )
'''
          if new not in s:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'production FIX10 block: expected exactly 1 old occurrence, found {count}')
              s = s.replace(old, new, 1)

          # No new FIX10 shadow references may remain in the production server.
          forbidden = [
              'fix10a_shadow_runtime',
              'FIX10A_SHADOW_ENABLED',
              'FIX10B_CANONICAL_ENABLED',
              '_fix10a_task',
          ]
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit(f'forbidden FIX10 shadow leftovers in server: {leftovers}')

          p.write_text(s)
          PY
          python -m py_compile backend/server.py
          git diff --check
          git diff -- backend/server.py
      - name: Commit production server integration only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/server.py; then
            echo 'Production server integration already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git commit -m 'FIX10: run physical reconciliation synchronously in production'
          git push origin HEAD:chatgpt-production-hardening
