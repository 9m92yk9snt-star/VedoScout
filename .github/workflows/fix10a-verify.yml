name: FIX10A verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goalproof-one-shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix10-match-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 pytest-asyncio==1.4.0 numpy==2.4.6 opencv-python-headless==4.13.0.92 python-dotenv==1.2.2
      - name: Provide no-network Emergent stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci_stubs/emergentintegrations/llm
          touch /tmp/ci_stubs/emergentintegrations/__init__.py /tmp/ci_stubs/emergentintegrations/llm/__init__.py
          cat > /tmp/ci_stubs/emergentintegrations/llm/chat.py <<'PY'
          class _Payload:
              def __init__(self, **kwargs): self.__dict__.update(kwargs)
          class UserMessage(_Payload): pass
          class ImageContent(_Payload): pass
          class FileContentWithMimeType(_Payload): pass
          class LlmChat:
              def __init__(self, **kwargs): self.__dict__.update(kwargs)
              def with_model(self, provider, model): self.provider=provider; self.model=model; return self
              async def send_message(self, _message): raise RuntimeError('CI network/model call forbidden')
          PY
      - name: Decode and apply staged source plus regressions
        shell: bash
        run: |
          set -euo pipefail
          cat docs/fix10a_goalproof_src00.tmp docs/fix10a_goalproof_src01.tmp docs/fix10a_goalproof_src02.tmp docs/fix10a_goalproof_src03.tmp | base64 -d | bunzip2 > /tmp/fix10a_goalproof.patch
          base64 -d docs/fix10a_goalproof_test.tmp | gunzip > backend/tests/test_fix10a7_structured_goal_proof.py
          base64 -d docs/fix10a_goalproof_golden.tmp | gunzip >> backend/tests/test_fix10a_golden_fixture_validator.py
          git apply --check /tmp/fix10a_goalproof.patch
          git apply /tmp/fix10a_goalproof.patch
      - name: Add fail-closed target strike linkage and fixture goal uniqueness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/golden_fixture_validator.py')
          s = p.read_text(encoding='utf-8')

          if 'def _assert_target_goal_plane_crossing(' not in s:
              marker = 'def _assert_forbidden_outcomes(outcomes: list[dict], forbidden) -> dict:\n'
              assert marker in s
              helper = '''def _assert_target_goal_plane_crossing(strikes: list[dict], outcomes: list[dict],\n                                       start_ms: int, end_ms: int) -> dict:\n    target_releases = _target_releases(strikes, start_ms, end_ms)\n    if not target_releases:\n        return {"status": UNRESOLVED, "reason": "TARGET_RELEASE_NOT_VERIFIED_FOR_GOAL_CHAIN"}\n    target_ids = {str(row.get("strike_id")) for row in target_releases\n                  if isinstance(row.get("strike_id"), str) and row.get("strike_id")}\n    goals = [row for row in outcomes if isinstance(row, dict)\n             and row.get("physical_outcome") == "GOAL_PLANE_CROSSING"]\n    linked = [row for row in goals if str(row.get("strike_id") or "") in target_ids]\n    if linked:\n        return {"status": PASS, "reason": "TARGET_RELEASE_LINKED_TO_GOAL_PLANE_CROSSING",\n                "target_strike_ids": sorted(target_ids),\n                "crossing_ms": [int(row["media_ms"]) for row in linked if _num(row.get("media_ms"))]}\n    if goals:\n        return {"status": FAIL, "reason": "GOAL_PLANE_CROSSING_LINKED_TO_DIFFERENT_STRIKE",\n                "target_strike_ids": sorted(target_ids),\n                "observed_strike_ids": sorted({str(row.get("strike_id") or "") for row in goals})}\n    return {"status": UNRESOLVED, "reason": "TARGET_GOAL_PLANE_CROSSING_NOT_VERIFIED",\n            "target_strike_ids": sorted(target_ids)}\n\n\n'''
              s = s.replace(marker, helper + marker, 1)

          if '"name": "require_target_goal_plane_crossing"' not in s:
              line = '        assertions.append({"name": "require_goal_plane_crossing", **_assert_required_outcome(outcomes, "GOAL_PLANE_CROSSING")})\n'
              assert line in s
              replacement = line + '''        assertions.append({\n            "name": "require_target_goal_plane_crossing",\n            **_assert_target_goal_plane_crossing(strikes, outcomes, strike_start, strike_end),\n        })\n'''
              s = s.replace(line, replacement, 1)

          if 'def _assert_exact_physical_goal_count(' not in s:
              marker = 'def validate_fixture(manifest: dict, physical_result: dict | None,\n'
              assert marker in s
              helper = '''def _assert_exact_physical_goal_count(manifest: dict, physical_result: dict | None) -> dict:\n    expected = sum(1 for case in (manifest.get("cases") or [])\n                   if isinstance(case, dict)\n                   and isinstance(case.get("physical_gate"), dict)\n                   and case["physical_gate"].get("require_goal_plane_crossing") is True)\n    result = physical_result if isinstance(physical_result, dict) else {}\n    seen, goals = set(), []\n    for trace in result.get("traces") or []:\n        if not isinstance(trace, dict):\n            continue\n        for outcome in trace.get("outcome_evidence") or []:\n            if not isinstance(outcome, dict) or outcome.get("physical_outcome") != "GOAL_PLANE_CROSSING":\n                continue\n            key = (str(outcome.get("strike_id") or ""),\n                   int(outcome["media_ms"]) if _num(outcome.get("media_ms")) else None)\n            if key in seen:\n                continue\n            seen.add(key); goals.append(outcome)\n    observed = len(goals)\n    if observed > expected:\n        status, reason = FAIL, "EXTRA_PHYSICAL_GOAL_CROSSING_ASSERTED"\n    elif observed < expected:\n        status, reason = UNRESOLVED, "REQUIRED_PHYSICAL_GOAL_CROSSING_NOT_VERIFIED"\n    else:\n        status, reason = PASS, "EXACT_PHYSICAL_GOAL_COUNT_MATCH"\n    return {"status": status, "reason": reason, "expected": expected, "observed": observed,\n            "strike_ids": [str(row.get("strike_id") or "") for row in goals]}\n\n\n'''
              s = s.replace(marker, helper + marker, 1)

          if '"fixture_assertions": fixture_assertions' not in s:
              status_line = '    statuses = [case["status"] for case in cases]\n'
              assert status_line in s
              s = s.replace(status_line, '''    fixture_assertions = [{\n        "name": "require_exact_physical_goal_count",\n        **_assert_exact_physical_goal_count(manifest, physical_result),\n    }]\n    statuses = [case["status"] for case in cases] + [a["status"] for a in fixture_assertions]\n''', 1)
              cases_line = '        "cases": cases,\n'
              pos = s.index('def validate_fixture(')
              before, tail = s[:pos], s[pos:]
              assert cases_line in tail
              tail = tail.replace(cases_line, cases_line + '        "fixture_assertions": fixture_assertions,\n', 1)
              s = before + tail

          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile and run full FIX10A regressions
        working-directory: backend
        env:
          PYTHONPATH: /tmp/ci_stubs:.
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fix10a_ball_proof_gate.py fix10a_goal_direction.py fix10a_vision_providers.py golden_fixture_validator.py shot_outcome_engine.py tests/test_fix10a7_structured_goal_proof.py tests/test_fix10a_golden_fixture_validator.py
          pytest --asyncio-mode=auto -q tests/test_fix10a*.py
      - name: Commit verified FIX10A source
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/fix10a_goalproof_src00.tmp docs/fix10a_goalproof_src01.tmp docs/fix10a_goalproof_src02.tmp docs/fix10a_goalproof_src03.tmp docs/fix10a_goalproof_test.tmp docs/fix10a_goalproof_golden.tmp
          rm -f .github/workflows/fix10a-goalproof-one-shot.yml
          git show 83bd47e5aacc3ef59d373883b86e19762b6cfa37:.github/workflows/fix10a-verify.yml > .github/workflows/fix10a-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'FIX10A: bind whole-ball goal proof to target strike'
          git push origin HEAD:fix10-match-intelligence
