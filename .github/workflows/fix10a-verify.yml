name: FIX10A verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix10a3-once:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.sha == '5a6f293b2377f2288219cb73f09b055b43085c0f'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix10-match-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact runtime blobs and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object backend/ball_trajectory.py)" = "761424feaac1625dc2792eeeec7624c342f370e2"
          test "$(git hash-object backend/dense_track_refinement.py)" = "8c3a5517fe6c1330dff9e506138074af067fe971"
          echo "8ecdd035294d55ce0f3ea03f289d42c5d5fd5f308a87ac99aea41b8f005d5388  .github/patches/fix10a3-dormant.patch" | sha256sum -c -
          git apply --check .github/patches/fix10a3-dormant.patch
      - name: Apply validated A3 patch
        run: git apply .github/patches/fix10a3-dormant.patch
      - name: Run focused A3 checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==9.0.3 numpy==2.4.6 opencv-python-headless==4.13.0.92 python-dotenv==1.2.2
          PYTHONPATH=backend pytest -q \
            backend/tests/test_fix10a3_ball_trajectory.py \
            backend/tests/test_fix10a3_dormant_reacquisition.py \
            backend/tests/test_fix10a2_dense_ball_floor.py
      - name: Commit runtime and tests only
        shell: bash
        run: |
          set -euo pipefail
          git add \
            backend/ball_trajectory.py \
            backend/dense_track_refinement.py \
            backend/tests/test_fix10a3_dormant_reacquisition.py \
            backend/tests/test_fix10a2_dense_ball_floor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX10A3: add dormant ball reacquisition'
          git push origin HEAD:fix10-match-intelligence
