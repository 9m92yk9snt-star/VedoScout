name: Orman1000 source-local distinct finisher release proof (once)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/orman1000-finisher-role-proof-once.yml'
permissions:
  contents: read
jobs:
  proof_contract:
    if: >-
      github.repository == '9m92yk9snt-star/VedoScout' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/matchroom-window-geometry-reuse' &&
      github.event.before == '12c18843fdf2cd03ef7c7a479f5df533a49e2b2f' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install no-inference dependencies only
        run: python -m pip install 'pytest==9.0.3' 'python-dotenv==1.2.2'
      - name: Compile source-bound review and release gates
        run: |
          python -m py_compile backend/orman1000_role_spatial_gate.py backend/scripts/check_orman1000_release_readiness.py
      - name: Verify per-frame person separation and unchanged 21-event review
        run: |
          python -m pytest -q backend/tests/test_orman1000_role_spatial_gate.py backend/tests/test_orman1000_release_gate.py backend/tests/test_orman1000_adjudication_preview.py backend/tests/test_orman1000_release_source.py
